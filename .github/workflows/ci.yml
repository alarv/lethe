name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor and where node:sqlite must work; 24 catches
        # anything the experimental SQLite API changes underneath us.
        node: ["22", "24"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Builds first, so this covers compilation too.
      - name: Test
        run: npm test

  package:
    runs-on: ubuntu-latest
    name: package contents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      # Runs on every commit rather than only at release, because the failure it
      # guards against is silent: the files allowlist once published a gitignored
      # working note for weeks. Finding that at release time is too late.
      - name: Tarball must not contain internal files
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          files=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].files.map(f=>f.path).join('\n')")
          fail=0
          while IFS= read -r forbidden; do
            if printf '%s\n' "$files" | grep -qx -- "$forbidden"; then
              echo "::error::$forbidden must not be published"
              fail=1
            fi
          done <<'FORBIDDEN'
          docs/lethe.md
          docs/competition.md
          FORBIDDEN
          if printf '%s\n' "$files" | grep -qE '^docs/superpowers/|\.test\.(js|d\.ts|js\.map)$|^dist/testing\.'; then
            echo "::error::internal specs, plans or test artifacts are in the tarball"
            fail=1
          fi
          exit $fail
