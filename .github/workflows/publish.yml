# Publish to npm on a version tag or a GitHub release.
#
#   npm version patch && git push --follow-tags    # tag-driven
#   or: cut a Release in the GitHub UI             # release-driven
#
# Both work, and the tag may be written either "v0.0.1" or "0.0.1", because
# guessing wrong should not mean a release that silently publishes nothing.
#
# Whichever path is taken, package.json is the source of truth: if the tag and
# the version disagree the run fails before anything reaches the registry. A
# mistagged release should be loud.
name: publish

on:
  push:
    tags:
      # Deliberately loose. A pattern precise enough to be wrong would mean a
      # release that publishes nothing and says nothing; the version check
      # below is what actually validates the tag.
      - "v*"
      - "[0-9]*"
  release:
    types: [published]
  # Runs every check without publishing, against any ref.
  workflow_dispatch:

permissions:
  # write, so the workflow can attach release notes to the tag it publishes.
  contents: write
  # Required for --provenance: npm verifies the build came from this workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22 is the engines floor, and the floor is where node:sqlite must work.
      # Passing on a newer Node would prove nothing about the version users have.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Builds first, so this also proves the artifact being published compiles.
      - name: Test
        run: npm test

      - name: Tag must match package.json
        if: github.event_name != 'workflow_dispatch'
        run: |
          # A release event names the tag in ref_name too, so one path handles both.
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match package.json version '$pkg' — bump one of them"
            exit 1
          fi
          echo "publishing $pkg"

      # This check exists because it already nearly went wrong: the files list
      # published the whole docs directory, so a gitignored working note was in
      # the tarball for weeks. A .gitignore entry does NOT protect a path that
      # the files allowlist includes, and nothing warns you.
      - name: Tarball must not contain internal files
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          files=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].files.map(f=>f.path).join('\n')")
          echo "$files"
          fail=0
          while IFS= read -r forbidden; do
            if printf '%s\n' "$files" | grep -qx -- "$forbidden"; then
              echo "::error::$forbidden must not be published"
              fail=1
            fi
          done <<'FORBIDDEN'
          docs/lethe.md
          docs/competition.md
          FORBIDDEN
          if printf '%s\n' "$files" | grep -qE '^docs/superpowers/|\.test\.(js|d\.ts|js\.map)$|^dist/testing\.'; then
            echo "::error::internal specs, plans or test artifacts are in the tarball"
            fail=1
          fi
          exit $fail

      # Release notes are the one thing no tool can derive from a diff: the value of
      # a change here is usually which failure it fixes. So the changelog is written
      # by hand, and publishing without an entry is refused rather than allowed to
      # produce a release nobody can read.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="$(node -p "require('./package.json').version")"
          # From the version heading to the next version heading, exclusive.
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && (/^## \\[/ || /^\\[[^]]+\\]: *http/) { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no entry for $version — add one under '## [$version]'"
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "found $(printf '%s' "$notes" | wc -l) lines of notes for $version"

      - name: Publish
        if: github.event_name != 'workflow_dispatch'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Only creates a release when one does not exist. A release cut by hand in the
      # UI already has a body somebody wrote; overwriting it would be rude.
      - name: Attach release notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving its notes alone"
          else
            printf '%s\n' "$NOTES" > /tmp/notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          fi
