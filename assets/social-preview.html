<!doctype html>
<!--
  Social preview for github.com/alarv/lethe — 1280x640.
  Render:  npm run assets

  Source of truth for assets/social-preview.png. Edit here, never the PNG.

  Requires assets/dark-seahorse.jpeg — the DARK-background artwork. It is composited
  with mix-blend-mode: screen, which drops its near-black background into ours
  without needing an alpha channel. A white-background version will NOT work here.

  Hippocampus, from the Greek: hippos (horse) + kampos (sea monster). Early
  anatomists named the brain structure after the animal it resembles.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: #0b0d10;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* warm current beneath the dissolution, cool depth behind the figure */
  body::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(760px 300px at 62% 62%, rgba(214,146,74,.13), transparent 72%),
      radial-gradient(900px 420px at 20% 40%, rgba(120,150,190,.06), transparent 75%);
  }

  .art {
    position: absolute; top: 50%; right: -40px; transform: translateY(-50%);
    height: 660px;
    mix-blend-mode: screen;      /* kills the near-black backdrop of the source */
    opacity: .95;
  }

  /* fade the artwork out on the left so it never collides with the type */
  .art-mask {
    position: absolute; top: 0; bottom: 0; left: 0; width: 620px;
    background: linear-gradient(to right, #0b0d10 34%, rgba(11,13,16,.85) 58%, transparent 100%);
  }

  .left {
    position: absolute; left: 76px; top: 50%; transform: translateY(-50%);
    width: 560px;
  }

  .mark {
    font-size: 92px; font-weight: 600; letter-spacing: -.038em;
    color: #f2f4f7; line-height: 1;
  }
  .mark .dot { color: #d6924a; }

  .tag {
    margin-top: 26px; font-size: 25px; line-height: 1.42;
    color: #9aa4b2; font-weight: 400; letter-spacing: -.012em;
  }
  .tag b { color: #d6924a; font-weight: 500; }

  .rule { margin-top: 34px; width: 60px; height: 2px; background: #d6924a; opacity: .85; }

  .meta {
    margin-top: 28px; font-size: 15px; letter-spacing: .05em;
    color: #626c78; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  }
</style>
</head>
<body>
  <img class="art" src="dark-seahorse.jpeg" alt="">
  <div class="art-mask"></div>

  <div class="left">
    <div class="mark">lethe<span class="dot">.</span></div>
    <div class="tag">A memory harness for coding agents<br>that <b>forgets on purpose</b>.</div>
    <div class="rule"></div>
  </div>
</body>
</html>
